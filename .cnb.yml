# 默认只验证和构建；生产发布需显式配置 docs/examples/cnb.deploy.yml。
"**":
  push: &checks
    - name: Go 测试
      docker:
        image: golang:1.26-bookworm
      stages:
        - name: 测试与竞态检查
          timeout: 15m
          script: go test -race ./...
        - name: 静态检查
          timeout: 5m
          script: go vet ./...
    - name: 前端构建
      docker:
        image: node:24
      stages:
        - name: 安装依赖
          timeout: 15m
          script: npm --prefix web ci
        - name: 构建
          timeout: 10m
          script: npm --prefix web run build
    - name: Docker 构建
      services:
        - docker
      stages:
        - name: 构建应用镜像
          timeout: 30m
          script: docker build -t online-bookmarks:ci .
  pull_request: *checks
